<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#071A3D"/>
    </linearGradient>

    <linearGradient id="blue" x1="150" y1="40" x2="1050" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(930 170) rotate(90) scale(190)">
      <stop stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="380" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">

    <!-- Background -->
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- Ambient glow -->
    <circle cx="960" cy="185" r="130" fill="#2563EB" opacity="0.12" filter="url(#blur)"/>

    <!-- Decorative lines -->
    <path d="M760 0L1200 250" stroke="#2563EB" stroke-opacity="0.14"/>
    <path d="M840 0L1200 205" stroke="#60A5FA" stroke-opacity="0.08"/>
    <path d="M900 380L1200 215" stroke="#2563EB" stroke-opacity="0.10"/>

    <!-- Small system label -->
    <text x="72" y="62"
      fill="#60A5FA"
      font-family="monospace"
      font-size="13"
      letter-spacing="3">
      PORTFOLIO / 2026
    </text>

    <!-- Main name -->
    <text x="68" y="166"
      fill="white"
      font-family="Arial, Helvetica, sans-serif"
      font-size="62"
      font-weight="800"
      letter-spacing="-2">
      G.S.I. VENKAT
    </text>

    <!-- Accent line -->
    <rect x="70" y="190" width="72" height="4" rx="2" fill="url(#blue)"/>

    <!-- Tagline -->
    <text x="70" y="238"
      fill="#CBD5E1"
      font-family="Arial, Helvetica, sans-serif"
      font-size="19"
      letter-spacing="1">
      CODE  ·  CREATE  ·  COMPETE
    </text>

    <!-- Descriptor -->
    <text x="70" y="282"
      fill="#64748B"
      font-family="monospace"
      font-size="13">
      AI / ML  ·  BUILDER  ·  FOOTBALL  ·  CREATIVE
    </text>

    <!-- Right-side orbital system -->
    <circle cx="960" cy="185" r="112"
      stroke="#60A5FA"
      stroke-opacity="0.18"
      stroke-width="1"/>

    <circle cx="960" cy="185" r="82"
      stroke="#2563EB"
      stroke-opacity="0.30"
      stroke-width="1"
      stroke-dasharray="4 9"/>

    <!-- Central mark -->
    <circle cx="960" cy="185" r="48"
      fill="#0B1220"
      stroke="#2563EB"
      stroke-width="2"/>

    <text x="960" y="194"
      text-anchor="middle"
      fill="white"
      font-family="monospace"
      font-size="25"
      font-weight="700">
      &lt;/&gt;
    </text>

    <!-- Football-inspired orbit -->
    <circle cx="960" cy="73" r="10"
      fill="#111827"
      stroke="#60A5FA"
      stroke-width="2"/>

    <path d="M954 68L960 64L966 68L964 75L956 75Z"
      fill="#2563EB"/>

    <!-- Orbit accent -->
    <circle cx="1040" cy="185" r="5" fill="#60A5FA"/>
    <circle cx="880" cy="185" r="4" fill="#2563EB"/>
    <circle cx="960" cy="297" r="4" fill="#38BDF8"/>

    <!-- Bottom metadata -->
    <text x="70" y="335"
      fill="#475569"
      font-family="monospace"
      font-size="11"
      letter-spacing="2">
      BUILDING THINGS THAT SHOULDN'T EXIST YET.
    </text>

    <text x="1130" y="335"
      text-anchor="end"
      fill="#334155"
      font-family="monospace"
      font-size="11">
      BENGALURU / INDIA
    </text>

    <!-- Border -->
    <rect x="1" y="1" width="1198" height="378" rx="23"
      stroke="#FFFFFF"
      stroke-opacity="0.10"/>

  </g>
</svg>